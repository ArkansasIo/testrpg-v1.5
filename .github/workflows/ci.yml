name: RPG prototype CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check preload-inventory.js
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON configuration
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))"
